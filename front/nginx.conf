server {
    listen 8080;
    # Ne pas afficher la version de nginx dans les réponses
    server_tokens off;

    # La page du jeu
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Tout ce qui commence par /api est transmis au back Python
    location /api/ {
        proxy_pass http://back:5000;
    }
}
